x-local-app-volumes: &local-app-volumes
  - ./app:/var/www/html/app
  - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
  - ./bootstrap/providers.php:/var/www/html/bootstrap/providers.php
  - ./config:/var/www/html/config
  - ./database:/var/www/html/database
  - ./resources:/var/www/html/resources
  - ./routes:/var/www/html/routes
  - ./storage:/var/www/html/storage

services:
  app:
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_STACK: single,stderr
      LOG_LEVEL: debug
    volumes: *local-app-volumes

  webserver:
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage:/var/www/html/storage:ro

  queue-worker:
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_STACK: single,stderr
      LOG_LEVEL: debug
    volumes: *local-app-volumes

  freshdesk-ingest-worker:
    volumes: *local-app-volumes

  durable-scheduler:
    volumes: *local-app-volumes

  durable-dispatcher:
    volumes: *local-app-volumes
