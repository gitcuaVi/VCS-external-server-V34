x-default-logging: &default-logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: app
        image: timer-v34-app:latest
        container_name: timer-v34-app
        restart: always
        init: true
        stop_grace_period: 30s
        logging: *default-logging
        security_opt:
            - no-new-privileges:true
        working_dir: /var/www/html
        env_file:
            - path: .env
              required: false
        environment:
            APP_NAME: ${APP_NAME:-TimerV34}
            APP_ENV: ${APP_ENV:-production}
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL:-http://localhost}
            LOG_CHANNEL: ${LOG_CHANNEL:-daily}
            LOG_STACK: ${LOG_STACK:-single}
            LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-90}
            LOG_LEVEL: ${LOG_LEVEL:-info}
            CACHE_STORE: ${CACHE_STORE:-redis}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
            SESSION_DRIVER: ${SESSION_DRIVER:-file}
            SESSION_ENCRYPT: ${SESSION_ENCRYPT:-true}
            SESSION_LIFETIME: ${SESSION_LIFETIME:-720}
            ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
            DB_CONNECTION: ${DB_CONNECTION:-pgsql}
            DB_HOST: ${DB_HOST:-postgres}
            DB_PORT: ${DB_PORT:-5432}
            DB_DATABASE: ${DB_DATABASE:-timer_v34_db}
            DB_USERNAME: ${DB_USERNAME:-timer_user}
            DB_PASSWORD: ${DB_PASSWORD:-timer_password_123}
            REDIS_HOST: ${REDIS_HOST:-redis}
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-360}
            FRESHDESK_DOMAIN: ${FRESHDESK_DOMAIN:-}
            FRESHDESK_API_KEY: ${FRESHDESK_API_KEY:-}
            FRESHDESK_API_RATE_LIMIT_ENABLED: ${FRESHDESK_API_RATE_LIMIT_ENABLED:-true}
            FRESHDESK_API_RATE_LIMIT: ${FRESHDESK_API_RATE_LIMIT:-50}
            FRESHDESK_API_RATE_WINDOW_SECONDS: ${FRESHDESK_API_RATE_WINDOW_SECONDS:-60}
            FRESHDESK_API_RATE_LIMIT_REDIS_CONNECTION: ${FRESHDESK_API_RATE_LIMIT_REDIS_CONNECTION:-default}
            FRESHDESK_WEBHOOK_USER: ${FRESHDESK_WEBHOOK_USER:-admin}
            FRESHDESK_WEBHOOK_PASSWORD: ${FRESHDESK_WEBHOOK_PASSWORD:-}
            FRESHDESK_REOPEN_THRESHOLD: ${FRESHDESK_REOPEN_THRESHOLD:-1440}
            ENABLE_LEGACY_TICKET_FILTER: ${ENABLE_LEGACY_TICKET_FILTER:-true}
            GO_LIVE_TIMESTAMP: ${GO_LIVE_TIMESTAMP:-}
            ROCKETCHAT_URL: ${ROCKETCHAT_URL:-http://host.docker.internal:3000}
            ROCKETCHAT_USER_ID: ${ROCKETCHAT_USER_ID:-}
            ROCKETCHAT_TOKEN: ${ROCKETCHAT_TOKEN:-}
            ROCKETCHAT_CHANNEL: ${ROCKETCHAT_CHANNEL:-GENERAL}
            ROCKETCHAT_WEBHOOK_URL: ${ROCKETCHAT_WEBHOOK_URL:-}
            ROCKETCHAT_AUDIT_RETENTION_DAYS: ${ROCKETCHAT_AUDIT_RETENTION_DAYS:-90}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - laravel-v34-storage:/var/www/html/storage
        healthcheck:
            test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 9000); if (!$$socket) { exit(1); } fclose($$socket);"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - timer-v34-network

    webserver:
        build:
            context: .
            dockerfile: Dockerfile
            target: webserver
        image: timer-v34-webserver:latest
        container_name: timer-v34-webserver
        restart: always
        stop_grace_period: 30s
        logging: *default-logging
        security_opt:
            - no-new-privileges:true
        ports:
            - "${APP_PORT:-8340}:80"
        volumes:
            - laravel-v34-storage:/var/www/html/storage:ro
        command:
            - /bin/sh
            - -c
            - |
              awk '/location \/ \{/{print "    location = /pg-db {\n        return 301 /pg-db/;\n    }\n\n    location /pg-db/ {\n        proxy_pass http://adminer:8080/;\n        proxy_set_header Host $$host;\n        proxy_set_header X-Real-IP $$remote_addr;\n        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $$scheme;\n        proxy_set_header X-Forwarded-Prefix /pg-db;\n        proxy_redirect off;\n    }\n"}1' /etc/nginx/conf.d/default.conf > /tmp/default.conf && mv /tmp/default.conf /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - timer-v34-network
        depends_on:
            app:
                condition: service_healthy
            adminer:
                condition: service_healthy

    ticket-logic-worker: &queue-worker-service
        image: timer-v34-app:latest
        container_name: timer-v34-ticket-logic-worker
        restart: always
        init: true
        stop_grace_period: 330s
        logging: *default-logging
        security_opt:
            - no-new-privileges:true
        working_dir: /var/www/html
        user: www-data
        command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=ticket-logic
            - --sleep=1
            - --tries=4
            - --backoff=15,30,60
            - --timeout=300
            - --max-time=3600
        env_file:
            - path: .env
              required: false
        environment:
            APP_NAME: ${APP_NAME:-TimerV34}
            APP_ENV: ${APP_ENV:-production}
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL:-http://localhost}
            LOG_CHANNEL: ${LOG_CHANNEL:-daily}
            LOG_STACK: ${LOG_STACK:-single}
            LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-90}
            LOG_LEVEL: ${LOG_LEVEL:-info}
            CACHE_STORE: ${CACHE_STORE:-redis}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
            SESSION_DRIVER: ${SESSION_DRIVER:-file}
            SESSION_ENCRYPT: ${SESSION_ENCRYPT:-true}
            SESSION_LIFETIME: ${SESSION_LIFETIME:-720}
            ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
            DB_CONNECTION: ${DB_CONNECTION:-pgsql}
            DB_HOST: ${DB_HOST:-postgres}
            DB_PORT: ${DB_PORT:-5432}
            DB_DATABASE: ${DB_DATABASE:-timer_v34_db}
            DB_USERNAME: ${DB_USERNAME:-timer_user}
            DB_PASSWORD: ${DB_PASSWORD:-timer_password_123}
            REDIS_HOST: ${REDIS_HOST:-redis}
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-360}
            FRESHDESK_DOMAIN: ${FRESHDESK_DOMAIN:-}
            FRESHDESK_API_KEY: ${FRESHDESK_API_KEY:-}
            FRESHDESK_API_RATE_LIMIT_ENABLED: ${FRESHDESK_API_RATE_LIMIT_ENABLED:-true}
            FRESHDESK_API_RATE_LIMIT: ${FRESHDESK_API_RATE_LIMIT:-50}
            FRESHDESK_API_RATE_WINDOW_SECONDS: ${FRESHDESK_API_RATE_WINDOW_SECONDS:-60}
            FRESHDESK_API_RATE_LIMIT_REDIS_CONNECTION: ${FRESHDESK_API_RATE_LIMIT_REDIS_CONNECTION:-default}
            FRESHDESK_WEBHOOK_USER: ${FRESHDESK_WEBHOOK_USER:-admin}
            FRESHDESK_WEBHOOK_PASSWORD: ${FRESHDESK_WEBHOOK_PASSWORD:-}
            FRESHDESK_REOPEN_THRESHOLD: ${FRESHDESK_REOPEN_THRESHOLD:-1440}
            ENABLE_LEGACY_TICKET_FILTER: ${ENABLE_LEGACY_TICKET_FILTER:-true}
            GO_LIVE_TIMESTAMP: ${GO_LIVE_TIMESTAMP:-}
            ROCKETCHAT_URL: ${ROCKETCHAT_URL:-http://host.docker.internal:3000}
            ROCKETCHAT_USER_ID: ${ROCKETCHAT_USER_ID:-}
            ROCKETCHAT_TOKEN: ${ROCKETCHAT_TOKEN:-}
            ROCKETCHAT_CHANNEL: ${ROCKETCHAT_CHANNEL:-GENERAL}
            ROCKETCHAT_WEBHOOK_URL: ${ROCKETCHAT_WEBHOOK_URL:-}
            ROCKETCHAT_AUDIT_RETENTION_DAYS: ${ROCKETCHAT_AUDIT_RETENTION_DAYS:-90}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - laravel-v34-storage:/var/www/html/storage
        networks:
            - timer-v34-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    freshdesk-outbound-worker:
        <<: *queue-worker-service
        container_name: timer-v34-freshdesk-outbound-worker
        stop_grace_period: 130s
        command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=freshdesk-outbound
            - --sleep=1
            - --tries=1
            - --timeout=105
            - --max-time=3600

    freshdesk-ingest-worker:
        image: timer-v34-app:latest
        container_name: timer-v34-freshdesk-ingest-worker
        restart: always
        init: true
        stop_grace_period: 130s
        logging: *default-logging
        security_opt:
            - no-new-privileges:true
        working_dir: /var/www/html
        user: www-data
        command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=freshdesk-ingest
            - --sleep=1
            - --tries=1
            - --timeout=120
            - --max-time=3600
        env_file:
            - path: .env
              required: false
        environment: &worker-environment
            APP_NAME: ${APP_NAME:-TimerV34}
            APP_ENV: ${APP_ENV:-production}
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL:-http://localhost}
            LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
            LOG_LEVEL: ${LOG_LEVEL:-info}
            CACHE_STORE: ${CACHE_STORE:-redis}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
            DB_CONNECTION: ${DB_CONNECTION:-pgsql}
            DB_HOST: ${DB_HOST:-postgres}
            DB_PORT: ${DB_PORT:-5432}
            DB_DATABASE: ${DB_DATABASE:-timer_v34_db}
            DB_USERNAME: ${DB_USERNAME:-timer_user}
            DB_PASSWORD: ${DB_PASSWORD:-timer_password_123}
            REDIS_HOST: ${REDIS_HOST:-redis}
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-360}
            FRESHDESK_DOMAIN: ${FRESHDESK_DOMAIN:-}
            FRESHDESK_API_KEY: ${FRESHDESK_API_KEY:-}
            FRESHDESK_API_RATE_LIMIT_ENABLED: ${FRESHDESK_API_RATE_LIMIT_ENABLED:-true}
            FRESHDESK_API_RATE_LIMIT: ${FRESHDESK_API_RATE_LIMIT:-50}
            FRESHDESK_API_RATE_WINDOW_SECONDS: ${FRESHDESK_API_RATE_WINDOW_SECONDS:-60}
            FRESHDESK_API_RATE_LIMIT_REDIS_CONNECTION: ${FRESHDESK_API_RATE_LIMIT_REDIS_CONNECTION:-default}
            FRESHDESK_REOPEN_THRESHOLD: ${FRESHDESK_REOPEN_THRESHOLD:-1440}
            ENABLE_LEGACY_TICKET_FILTER: ${ENABLE_LEGACY_TICKET_FILTER:-true}
            GO_LIVE_TIMESTAMP: ${GO_LIVE_TIMESTAMP:-}
            FRESHDESK_SPOOL_ENABLED: ${FRESHDESK_SPOOL_ENABLED:-true}
            FRESHDESK_REQUIRE_DIRECTORY_FSYNC: ${FRESHDESK_REQUIRE_DIRECTORY_FSYNC:-true}
            ROCKETCHAT_URL: ${ROCKETCHAT_URL:-http://host.docker.internal:3000}
            ROCKETCHAT_USER_ID: ${ROCKETCHAT_USER_ID:-}
            ROCKETCHAT_TOKEN: ${ROCKETCHAT_TOKEN:-}
            ROCKETCHAT_CHANNEL: ${ROCKETCHAT_CHANNEL:-GENERAL}
            ROCKETCHAT_AUDIT_RETENTION_DAYS: ${ROCKETCHAT_AUDIT_RETENTION_DAYS:-90}
        volumes:
            - laravel-v34-storage:/var/www/html/storage
        networks:
            - timer-v34-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    durable-scheduler:
        image: timer-v34-app:latest
        container_name: timer-v34-durable-scheduler
        restart: always
        init: true
        stop_grace_period: 90s
        cpus: "0.50"
        mem_limit: 384m
        pids_limit: 32
        logging: *default-logging
        security_opt:
            - no-new-privileges:true
        working_dir: /var/www/html
        user: www-data
        command: ["php", "artisan", "schedule:work"]
        env_file:
            - path: .env
              required: false
        environment:
            <<: *worker-environment
            CACHE_STORE: file
        volumes:
            - laravel-v34-storage:/var/www/html/storage
        networks:
            - timer-v34-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    durable-dispatcher:
        image: timer-v34-app:latest
        container_name: timer-v34-durable-dispatcher
        restart: always
        init: true
        stop_grace_period: 60s
        logging: *default-logging
        security_opt:
            - no-new-privileges:true
        working_dir: /var/www/html
        user: www-data
        command:
            - php
            - artisan
            - durable-dispatch:work
            - --spool-limit=50
            - --logic-limit=50
            - --outbound-limit=50
            - --idle-sleep=1
            - --max-backoff=30
            - --max-time=3600
            - --memory=128
        env_file:
            - path: .env
              required: false
        environment:
            <<: *worker-environment
            CACHE_STORE: file
        volumes:
            - laravel-v34-storage:/var/www/html/storage
        networks:
            - timer-v34-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:16-alpine
        container_name: timer-v34-postgres
        restart: always
        stop_grace_period: 60s
        logging: *default-logging
        security_opt:
            - no-new-privileges:true
        environment:
            POSTGRES_DB: ${DB_DATABASE:-timer_v34_db}
            POSTGRES_USER: ${DB_USERNAME:-timer_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-timer_password_123}
        ports:
            - "127.0.0.1:${FORWARD_DB_PORT:-5434}:5432"
        volumes:
            - postgres-v34-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - timer-v34-network

    redis:
        image: redis:7-alpine
        container_name: timer-v34-redis
        restart: always
        stop_grace_period: 30s
        logging: *default-logging
        security_opt:
            - no-new-privileges:true
        env_file:
            - path: .env
              required: false
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
        command:
            ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server --appendonly yes --appendfsync everysec; fi"]
        ports:
            - "127.0.0.1:${FORWARD_REDIS_PORT:-6384}:6379"
        volumes:
            - redis-v34-data:/data
        healthcheck:
            test:
                - CMD-SHELL
                - 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi'
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
        networks:
            - timer-v34-network

    adminer:
        image: adminer:4.8.1-standalone
        container_name: timer-v34-adminer
        restart: always
        stop_grace_period: 10s
        logging: *default-logging
        security_opt:
            - no-new-privileges:true
        environment:
            ADMINER_DEFAULT_SERVER: postgres
        healthcheck:
            test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 8080); if (!$$socket) { exit(1); } fclose($$socket);"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        networks:
            - timer-v34-network
        depends_on:
            postgres:
                condition: service_healthy

networks:
    timer-v34-network:
        driver: bridge

volumes:
    laravel-v34-storage:
        driver: local
    postgres-v34-data:
        driver: local
    redis-v34-data:
        driver: local
